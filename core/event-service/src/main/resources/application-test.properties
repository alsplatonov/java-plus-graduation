spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:main_test
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

server.port=8080

spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.cloud.config.import-check.enabled=false

grpc.client.collector.address=static://localhost:1
grpc.client.analyzer.address=static://localhost:1
grpc.client.collector.negotiationType=plaintext
grpc.client.analyzer.negotiationType=plaintext
