services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    container_name: config-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_started
    restart: on-failure

  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    container_name: stats-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d stats"]
      interval: 3s
      timeout: 3s
      retries: 5

  ewm-service:
    build:
      context: .
      dockerfile: core/main-service/Dockerfile
    container_name: ewm-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      ewm-db:
        condition: service_healthy
      config-server:
        condition: service_started
      stats-server:
        condition: service_started
    restart: on-failure

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6642:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d main"]
      interval: 3s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  user-db:
    image: postgres:16.1
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6643:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    container_name: request-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      request-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  request-db:
    image: postgres:16.1
    container_name: request-db
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6644:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d request_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  rating-service:
    build:
      context: .
      dockerfile: core/rating-service/Dockerfile
    container_name: rating-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
