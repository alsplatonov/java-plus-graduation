services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    container_name: config-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_started
    restart: on-failure


  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true

  collector:
    build:
      context: .
      dockerfile: stats/collector/Dockerfile
    container_name: collector
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      config-server:
        condition: service_started
    restart: on-failure

  aggregator:
    build:
      context: .
      dockerfile: stats/aggregator/Dockerfile
    container_name: aggregator
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      config-server:
        condition: service_started
    restart: on-failure

  analyzer:
    build:
      context: .
      dockerfile: stats/analyzer/Dockerfile
    container_name: analyzer
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      analyzer-db:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      config-server:
        condition: service_started
    restart: on-failure

  analyzer-db:
    image: postgres:16.1
    container_name: analyzer-db
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6646:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d analyzer_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  ewm-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    container_name: ewm-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      ewm-db:
        condition: service_healthy
      config-server:
        condition: service_started
      collector:
        condition: service_started
      analyzer:
        condition: service_started
    restart: on-failure

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6642:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d main"]
      interval: 3s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  user-db:
    image: postgres:16.1
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6643:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    container_name: request-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      request-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  request-db:
    image: postgres:16.1
    container_name: request-db
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6644:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d request_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  rating-service:
    build:
      context: .
      dockerfile: core/rating-service/Dockerfile
    container_name: rating-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JAVA_OPTS=-Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
    depends_on:
      rating-db:
        condition: service_healthy
      config-server:
        condition: service_started
    restart: on-failure

  rating-db:
    image: postgres:16.1
    container_name: rating-db
    environment:
      POSTGRES_DB: rating_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: '12345'
    ports:
      - "6645:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d rating_db"]
      interval: 3s
      timeout: 3s
      retries: 5
