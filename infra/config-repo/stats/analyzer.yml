server:
  port: 0

grpc:
  server:
    port: 0

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6646/analyzer_db
    username: dbuser
    password: 12345
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

kafka:
  bootstrap-servers: localhost:9092
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1
  consumer:
    group-id-prefix: analyzer

analyzer:
  recommendations:
    # сколько последних взаимодействий пользователя берётся для поиска похожих мероприятий
    recent-interactions: 10
    # сколько ближайших соседей учитывается при предсказании оценки
    neighbours: 5
