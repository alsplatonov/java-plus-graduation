eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"
    lease-renewal-interval-in-seconds: 10

# Межсервисные вызовы (OpenFeign): circuit breaker (Resilience4j) и таймауты
# Повтор запроса при ответах 5xx настроен в ewm.client.FeignClientConfig (Retryer), параметры circuit breaker — в ewm.client.ResilienceConfig
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 2000

# gRPC-клиенты сервисов статистики: адреса берутся из Eureka
grpc:
  client:
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
