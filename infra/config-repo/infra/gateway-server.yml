server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Маршруты проверяются по порядку: сначала специфичные, затем все остальные в main-service
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: request-service-route
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**,/users/*/events/*/requests/**

        - id: rating-service-route
          uri: lb://rating-service
          predicates:
            - Path=/users/*/events/*/like,/users/*/events/*/dislike,/users/*/events/*/rating,/users/*/rating,/users/top-authors

        - id: main-service-route
          uri: lb://main-service
          predicates:
            - Path=/admin/**,/users/**,/categories/**,/events/**,/compilations/**
